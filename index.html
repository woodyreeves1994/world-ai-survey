<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071225" />
  <title>Human / AI — The World AI Survey</title>
  <meta name="description" content="A global study of how people feel about living through the AI transition." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#survey">Skip to survey</a>
  <div id="app">
    <header class="topbar tone-dark" id="topbar" aria-label="Survey controls">
      <button class="brand" id="homeBtn" aria-label="Return to survey introduction">
        <svg class="brand-logo" viewBox="0 0 56 56" aria-hidden="true">
          <circle class="brand-ring" cx="28" cy="28" r="23" />
          <path class="brand-human" d="M16 33c0-10.2 5.2-17.2 13.1-17.2 5.1 0 9.6 2.8 12.1 7.2-7.4-.8-12.8 2.6-14.4 8.1-1.4 4.7-4.6 8-9.4 9.4A22.5 22.5 0 0 1 16 33Z" />
          <path class="brand-ai" d="M40.7 22.7c.9 2 1.3 4.1 1.3 6.4 0 8-6.1 14.4-13.7 14.4-5.2 0-9.7-2.9-12.1-7.2 7 .6 12.1-2.6 13.8-8 1.4-4.4 4.8-7.6 9.6-8.8.4 1 .8 2.1 1.1 3.2Z" />
          <circle class="brand-node n1" cx="42" cy="13" r="3" />
          <circle class="brand-node n2" cx="47" cy="24" r="2" />
          <path class="brand-link" d="M39.5 15.2 44.9 22" />
        </svg>
        <span class="brand-copy"><strong>HUMAN / AI</strong><small>THE WORLD SURVEY</small></span>
      </button>

      <div class="progress-wrap" aria-label="Survey progress">
        <div class="progress-meta"><span id="progressLabel">INTRO</span><span id="progressPct">0%</span></div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="top-actions">
        <button class="utility-btn" id="motionBtn" aria-pressed="false" title="Reduce animation">MOTION ON</button>
        <button class="utility-btn" id="soundBtn" aria-pressed="false" title="Toggle subtle interface sound">SOUND OFF</button>
      </div>
    </header>

    <main id="survey" tabindex="-1"></main>
    <div class="sr-only" id="announcer" aria-live="polite"></div>
    <div class="nav-hint" id="navHint" aria-hidden="true"><span>ENTER</span> continue · <span>ESC</span> back</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
